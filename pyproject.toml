[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-trading"
version = "1.0.0"
description = "Statistical trading algorithm using statistical inference methods to predict US stock prices"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yfinance==0.2.66",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scikit-learn==1.3.2",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "scipy==1.11.4",
    "statsmodels==0.14.0",
    "pyyaml==6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
